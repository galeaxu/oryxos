<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'JetBrains Mono','Fira Code',monospace">
  <rect width="720" height="440" fill="#ffffff"/>

  <!-- Access layer -->
  <text x="360" y="30" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#999999">ACCESS</text>
  <rect x="90" y="42" width="240" height="46" rx="10" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="210" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">CLI Channel</text>
  <rect x="390" y="42" width="240" height="46" rx="10" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="510" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Web Service (REST API)</text>

  <text x="360" y="118" text-anchor="middle" font-size="18" fill="#bbbbbb">↕</text>

  <!-- Engine layer -->
  <text x="360" y="148" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#999999">ENGINE</text>
  <rect x="90" y="160" width="540" height="46" rx="10" fill="#000000" stroke="#000000"/>
  <text x="360" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">ReActLoop · PromptBuilder · ToolExecutor</text>

  <text x="360" y="236" text-anchor="middle" font-size="18" fill="#bbbbbb">↕</text>

  <!-- Capabilities layer -->
  <text x="360" y="266" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#999999">CAPABILITIES</text>
  <rect x="90" y="278" width="170" height="56" rx="10" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="175" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Provider</text>
  <text x="175" y="320" text-anchor="middle" font-size="11" fill="#999999">LLM</text>
  <rect x="275" y="278" width="170" height="56" rx="10" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="360" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Memory</text>
  <text x="360" y="320" text-anchor="middle" font-size="11" fill="#999999">3-layer memory</text>
  <rect x="460" y="278" width="170" height="56" rx="10" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="545" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Tool</text>
  <text x="545" y="320" text-anchor="middle" font-size="11" fill="#999999">built-in + plugin</text>

  <text x="360" y="366" text-anchor="middle" font-size="18" fill="#bbbbbb">↕</text>

  <!-- Foundation layer -->
  <text x="360" y="396" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="2" fill="#999999">FOUNDATION</text>
  <rect x="90" y="408" width="540" height="24" rx="8" fill="#f5f5f5" stroke="#d4d4d4"/>
  <text x="360" y="424" text-anchor="middle" font-size="11" fill="#555555">Profile / Bootstrap / Skill loading · Session store · SQLite · Config &amp; secrets</text>
</svg>
