server:
  port: 8080

spring:
  application:
    name: oryxos
  datasource:
    url: jdbc:sqlite:${user.dir}/.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

