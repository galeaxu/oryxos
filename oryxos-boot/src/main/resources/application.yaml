server:
  port: 8080

spring:
  application:
    name: oryxos
  datasource:
    url: jdbc:sqlite:${user.dir}/.oryxos/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: false

# 监控：Actuator 端点与 Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: oryxos

